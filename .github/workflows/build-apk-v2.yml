name: Build APK - Psyktikos v1.0 FINAL - Βλαβολόγιο

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Psyktikos v1.0 FINAL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract original Psyktikos project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Psyktikos_v1_0_FINAL_project_FIXED3.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found."
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          while IFS= read -r settings_file; do
            candidate="$(dirname "$settings_file")"

            if [ -f "$candidate/app/build.gradle" ] || \
               [ -f "$candidate/app/build.gradle.kts" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(
            find extracted -type f \
              -name "settings.gradle" -o -name "settings.gradle.kts" \
              | sort
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Locate MainActivity.kt
        shell: bash
        run: |
          set -euo pipefail

          MAIN_ACTIVITY="$(
            find "$PROJECT_DIR" \
              -type f \
              -name "MainActivity.kt" \
              | head -n 1
          )"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.kt not found."
            exit 1
          fi

          echo "MAIN_ACTIVITY=$MAIN_ACTIVITY" >> "$GITHUB_ENV"

          echo "MainActivity:"
          echo "$MAIN_ACTIVITY"

      - name: Replace ONLY the fault database
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path(os.environ["MAIN_ACTIVITY"])
          text = path.read_text(encoding="utf-8")

          start = text.find('data class Fault(')
          faults_start = text.find('private val faults = listOf(', start)

          if start == -1 or faults_start == -1:
              raise SystemExit(
                  "ERROR: Existing Fault database was not found. "
                  "Original MainActivity was not modified."
              )

          # Find the closing ')' of the existing faults list.
          depth = 0
          end = None
          in_string = False
          escaped = False

          for i in range(faults_start, len(text)):
              ch = text[i]

              if ch == '"' and not escaped:
                  in_string = not in_string

              if not in_string:
                  if ch == '(':
                      depth += 1
                  elif ch == ')':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break

              escaped = (ch == '\\' and not escaped)

          if end is None:
              raise SystemExit("ERROR: Could not locate end of faults database.")

          new_faults = r'''private val faults = listOf(

              Fault("Daikin", "U4", "Σφάλμα επικοινωνίας εσωτερικής–εξωτερικής μονάδας", "Καλωδίωση, τροφοδοσία, πλακέτα, επικοινωνία", "Έλεγξε καλωδίωση, ακροδέκτες, τάσεις, πλακέτες και συνδέσεις."),
              Fault("Daikin", "A1", "Βλάβη πλακέτας εσωτερικής μονάδας", "PCB, τροφοδοσία, επικοινωνία", "Έλεγξε τροφοδοσία, ασφάλειες, PCB και επικοινωνία."),
              Fault("Daikin", "A3", "Πρόβλημα αποχέτευσης", "Βουλωμένη αποχέτευση, αντλία, αισθητήρας στάθμης", "Έλεγξε σωλήνα αποχέτευσης, αντλία και αισθητήρα."),
              Fault("Daikin", "A5", "Προστασία κατά της ψύξης/πάγου στον εναλλάκτη", "Μειωμένη ροή αέρα, φίλτρα, αισθητήρας, ψυκτικό κύκλωμα", "Έλεγξε φίλτρα, εναλλάκτη, ανεμιστήρα, αισθητήρες και ψυκτικό."),
              Fault("Daikin", "A6", "Βλάβη ανεμιστήρα εσωτερικής μονάδας", "Μοτέρ, πλακέτα, καλωδίωση", "Έλεγξε μοτέρ, φτερωτή, τάσεις και PCB."),
              Fault("Daikin", "E5", "Υπερφόρτωση συμπιεστή", "Συμπιεστής, υψηλή πίεση, υπερθέρμανση", "Έλεγξε πιέσεις, ρεύμα, συμπιεστή και συνθήκες λειτουργίας."),
              Fault("Daikin", "E6", "Βλάβη εκκίνησης συμπιεστή", "Συμπιεστής, inverter, πλακέτα", "Έλεγξε συμπιεστή, inverter PCB και ρεύματα."),
              Fault("Daikin", "E7", "Βλάβη ανεμιστήρα εξωτερικής μονάδας", "Μοτέρ, PCB, καλωδίωση", "Έλεγξε μοτέρ, φτερωτή, PCB και τάσεις."),
              Fault("Daikin", "F3", "Υψηλή θερμοκρασία κατάθλιψης", "Έλλειψη ψυκτικού, συμπιεστής, ροή αέρα", "Έλεγξε θερμοκρασία κατάθλιψης, SH/SC, διαρροές και εναλλάκτες."),
              Fault("Daikin", "F6", "Ανωμαλία πίεσης/θερμοκρασίας ψυκτικού", "Φόρτιση, αισθητήρες, εκτονωτικό", "Έλεγξε πιέσεις, αισθητήρες και κύκλωμα ψυκτικού."),

