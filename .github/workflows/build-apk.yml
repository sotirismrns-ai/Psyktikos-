name: Build Psyktikos APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -q Psyktikos_v1_0_FINAL_project.zip -d project

      - name: Find Android project
        run: |
          SETTINGS=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android Gradle project was not found."
            echo "ZIP contents:"
            find project -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Enable AndroidX
        run: |
          touch "$PROJECT_DIR/gradle.properties"

          if grep -q "^android.useAndroidX=" "$PROJECT_DIR/gradle.properties"; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' "$PROJECT_DIR/gradle.properties"
          else
            echo "android.useAndroidX=true" >> "$PROJECT_DIR/gradle.properties"
          fi

          if grep -q "^android.enableJetifier=" "$PROJECT_DIR/gradle.properties"; then
            sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' "$PROJECT_DIR/gradle.properties"
          else
            echo "android.enableJetifier=true" >> "$PROJECT_DIR/gradle.properties"
          fi

          echo "=== gradle.properties ==="
          cat "$PROJECT_DIR/gradle.properties"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.10"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Locate APK
        run: |
          echo "=== APK FILES ==="
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Psyktikos-v1.0-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
