name: Build APK - Psyktikos v1.0 FINAL

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Psyktikos v1.0 FINAL
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Psyktikos project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Psyktikos_v1_0_BLABOLOGIO_CODE.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found."
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "=== Extracted files ==="
          find extracted -maxdepth 6 -type f | sort

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          while IFS= read -r settings_file; do
            candidate="$(dirname "$settings_file")"

            if [ -f "$candidate/app/build.gradle" ] || \
               [ -f "$candidate/app/build.gradle.kts" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(
            find extracted -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              | sort
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project was not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=== Android project ==="
          echo "$PROJECT_DIR"

      - name: Enable AndroidX
        shell: bash
        run: |
          set -euo pipefail

          FILE="$PROJECT_DIR/gradle.properties"

          if [ -f "$FILE" ]; then
            if grep -q '^android.useAndroidX=' "$FILE"; then
              sed -i \
                's/^android.useAndroidX=.*/android.useAndroidX=true/' \
                "$FILE"
            else
              printf '\nandroid.useAndroidX=true\n' >> "$FILE"
            fi
          else
            printf 'android.useAndroidX=true\n' > "$FILE"
          fi

      - name: Fix Java/Kotlin JVM compatibility
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="$PROJECT_DIR/app/build.gradle"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          python3 - "$APP_GRADLE" <<'PY'
          from pathlib import Path
          import sys
          import re

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          compile_options = """compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
          }"""

          if re.search(r'\bcompileOptions\s*\{', text):
              text = re.sub(
                  r'\bcompileOptions\s*\{.*?\}',
                  compile_options,
                  text,
                  count=1,
                  flags=re.DOTALL
              )
          else:
              android_match = re.search(r'\bandroid\s*\{', text)

              if not android_match:
                  raise SystemExit(
                      "ERROR: android { } block was not found."
                  )

              insertion = (
                  "\n\n    "
                  + compile_options.replace("\n", "\n    ")
                  + "\n"
              )

              text = (
                  text[:android_match.end()]
                  + insertion
                  + text[android_match.end():]
              )

          kotlin_block = """kotlinOptions {
              jvmTarget = '17'
          }"""

          if re.search(r'\bkotlinOptions\s*\{', text):
              text = re.sub(
                  r'\bkotlinOptions\s*\{.*?\}',
                  kotlin_block,
                  text,
                  count=1,
                  flags=re.DOTALL
              )
          else:
              text += """

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          """

          path.write_text(text, encoding="utf-8")
          PY

      - name: Set increasing versionCode
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="$PROJECT_DIR/app/build.gradle"

          python3 - "$APP_GRADLE" "$GITHUB_RUN_NUMBER" <<'PY'
          from pathlib import Path
          import sys
          import re

          path = Path(sys.argv[1])
          run_number = int(sys.argv[2])

          text = path.read_text(encoding="utf-8")

          new_code = 1000 + run_number

          match = re.search(
              r'(\bversionCode\s+)(\d+)',
              text
          )

          if not match:
              raise SystemExit(
                  "ERROR: versionCode was not found."
              )

          old_code = int(match.group(2))

          text = (
              text[:match.start(2)]
              + str(new_code)
              + text[match.end(2):]
          )

          path.write_text(text, encoding="utf-8")

          print(f"versionCode: {old_code} -> {new_code}")
          PY

      - name: Restore permanent signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is empty or missing."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/psyktikos-signing"

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/psyktikos-signing/psyktikos-release.jks"

          if [ ! -s "$RUNNER_TEMP/psyktikos-signing/psyktikos-release.jks" ]; then
            echo "ERROR: Keystore was not created."
            exit 1
          fi

          echo "KEYSTORE_FILE=$RUNNER_TEMP/psyktikos-signing/psyktikos-release.jks" >> "$GITHUB_ENV"

          echo "Permanent signing keystore restored successfully."

      - name: Configure permanent Release signing
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          APP_GRADLE="$PROJECT_DIR/app/build.gradle"

          python3 - "$APP_GRADLE" "$KEYSTORE_FILE" "$KEYSTORE_PASSWORD" <<'PY'
          from pathlib import Path
          import sys
          import re

          path = Path(sys.argv[1])
          keystore_file = sys.argv[2]
          password = sys.argv[3]

          text = path.read_text(encoding="utf-8")

          if "signingConfigs" in text:
              raise SystemExit(
                  "ERROR: signingConfigs already exists. "
                  "Refusing to modify it automatically."
              )

          signing_block = f"""
          signingConfigs {{
              release {{
                  storeFile file('{keystore_file}')
                  storePassword '{password}'
                  keyAlias 'psyktikos'
                  keyPassword '{password}'
              }}
          }}
          """

          android_match = re.search(r'\bandroid\s*\{', text)

          if not android_match:
              raise SystemExit(
                  "ERROR: android block was not found."
              )

          insertion = (
              "\n"
              + signing_block
              + "\n"
          )

          text = (
              text[:android_match.end()]
              + insertion
              + text[android_match.end():]
          )

          build_types_match = re.search(
              r'\bbuildTypes\s*\{',
              text
          )

          if build_types_match:
              release_match = re.search(
                  r'\brelease\s*\{',
                  text[build_types_match.end():]
              )

              if release_match:
                  absolute_start = (
                      build_types_match.end()
                      + release_match.start()
                  )

                  brace_start = text.find(
                      "{",
                      absolute_start
                  )

                  depth = 0
                  brace_end = None

                  for i in range(brace_start, len(text)):
                      if text[i] == "{":
                          depth += 1
                      elif text[i] == "}":
                          depth -= 1
                          if depth == 0:
                              brace_end = i
                              break

                  if brace_end is None:
                      raise SystemExit(
                          "ERROR: release block could not be parsed."
                      )

                  release_body = text[
                      brace_start + 1:brace_end
                  ]

                  release_body += """
                      signingConfig signingConfigs.release
                  """

                  text = (
                      text[:brace_start + 1]
                      + release_body
                      + text[brace_end:]
                  )

              else:
                  raise SystemExit(
                      "ERROR: release build type was not found."
                  )

          else:
              text += """
          
          android {
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          """

          path.write_text(text, encoding="utf-8")
          PY

          echo "=== Release signing configured ==="
          grep -n -A10 -B2 "signingConfigs" "$APP_GRADLE"
          grep -n -A8 -B2 "signingConfig signingConfigs.release" "$APP_GRADLE"

      - name: Detect Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
          else
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
          fi

      - name: Build signed Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          "$GRADLE_CMD" clean assembleRelease --stacktrace

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="$(
            find "$PROJECT_DIR/app/build/outputs/apk/release" \
              -type f \
              -name "*.apk" \
              | sort \
              | head -n 1
          )"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo "APK: $APK_FILE"

          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --verbose "$APK_FILE"
          else
            echo "apksigner command not available; Gradle signing completed."
          fi

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="$(
            find "$PROJECT_DIR/app/build/outputs/apk/release" \
              -type f \
              -name "*.apk" \
              | sort \
              | head -n 1
          )"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not found."
            exit 1
          fi

          rm -rf "$GITHUB_WORKSPACE/apk-output"
          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/apk-output/Psyktikos-v1.0-BLABOLOGIO.apk"

          ls -lh \
            "$GITHUB_WORKSPACE/apk-output/Psyktikos-v1.0-BLABOLOGIO.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Psyktikos-v1.0-BLABOLOGIO
          path: apk-output/Psyktikos-v1.0-BLABOLOGIO.apk
          if-no-files-found: error
          retention-days: 7
