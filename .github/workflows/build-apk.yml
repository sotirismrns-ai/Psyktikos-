name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    name: Build Psyktikos v1.0 FINAL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Psyktikos v1.0 FINAL
        run: |
          set -e

          PROJECT_DIR="extracted/Psyktikos_v1_0"

          echo "=== Project directory ==="
          pwd
          echo "$PROJECT_DIR"

          echo "=== Project files ==="
          find "$PROJECT_DIR" -maxdepth 4 -type f | sort

          cd "$PROJECT_DIR"

          echo "=== Building Psyktikos v1.0 FINAL ==="

          gradle clean assembleDebug --no-daemon

      - name: Find APK
        run: |
          set -e

          APK=$(find extracted/Psyktikos_v1_0/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p release
          cp "$APK" release/Psyktikos_v1_0_FINAL.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Psyktikos_v1_0_FINAL
          path: release/Psyktikos_v1_0_FINAL.apk
          if-no-files-found: error
