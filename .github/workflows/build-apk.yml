name: Build Psyktikos APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Psyktikos Update
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check required files
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          ZIP_FILE="Psyktikos_v1_3_BLABOLOGIO_EXPANDED.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found"
            exit 1
          fi

          if [ ! -f "KEYSTORE_BASE64-1.txt" ]; then
            echo "ERROR: KEYSTORE_BASE64-1.txt not found"
            exit 1
          fi

          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: GitHub Secret KEYSTORE_PASSWORD is missing"
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Required files OK"

      - name: Extract Psyktikos project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Project extracted"

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(find extracted \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)"

          if [ -z "${SETTINGS_FILE:-}" ]; then
            echo "ERROR: Android project not found inside ZIP"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle not found"
            exit 1
          fi

          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found:"
          echo "$PROJECT_DIR"

      - name: Restore permanent signing key
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          mkdir -p "$ANDROID_PROJECT_DIR/keystore"

          base64 -d \
            "$GITHUB_WORKSPACE/KEYSTORE_BASE64-1.txt" \
            > "$ANDROID_PROJECT_DIR/keystore/psyktikos-release.jks"

          chmod 600 \
            "$ANDROID_PROJECT_DIR/keystore/psyktikos-release.jks"

          keytool \
            -list \
            -keystore "$ANDROID_PROJECT_DIR/keystore/psyktikos-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias psyktikos \
            > /tmp/psyktikos-key-check.txt

          echo "Permanent Psyktikos signing key verified"
          echo "Alias: psyktikos"

      - name: Set package version signing and Java 17
        shell: bash
        run: |
          set -euo pipefail

          APP_BUILD="$ANDROID_PROJECT_DIR/app/build.gradle"

          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.3.${GITHUB_RUN_NUMBER}"

          python3 - "$APP_BUILD" "$VERSION_CODE" "$VERSION_NAME" <<'PY'
          import re
          import sys

          path = sys.argv[1]
          version_code = sys.argv[2]
          version_name = sys.argv[3]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          text = re.sub(
              r'applicationId\s+["\'][^"\']+["\']',
              "applicationId 'com.psyktikos.app'",
              text
          )

          text = re.sub(
              r'versionCode\s+\d+',
              f"versionCode {version_code}",
              text
          )

          text = re.sub(
              r'versionName\s+["\'][^"\']+["\']',
              f"versionName '{version_name}'",
              text
          )

          if "signingConfigs {" not in text:
              text = text.replace(
                  "android {",
                  """android {
              signingConfigs {
                  release {
                      storeFile file("../keystore/psyktikos-release.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias "psyktikos"
                      keyPassword System.getenv("KEYSTORE_PASSWORD")
                  }
              }
          """,
                  1
              )

          if "signingConfig signingConfigs.release" not in text:
              if "release {" in text:
                  text = text.replace(
                      "release {",
                      """release {
                      signingConfig signingConfigs.release""",
                      1
                  )
              else:
                  raise SystemExit("ERROR: release buildType not found")

          if "compileOptions {" not in text:
              marker = text.rfind("}")

              if marker == -1:
                  raise SystemExit("ERROR: Invalid app/build.gradle")

              java_config = """
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          """

              text = text[:marker] + java_config + "\n" + text[marker:]

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY

          echo "PSYKTIKOS_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "PSYKTIKOS_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          echo "Package: com.psyktikos.app"
          echo "VersionCode: $VERSION_CODE"
          echo "VersionName: $VERSION_NAME"

      - name: Ensure AndroidX
        shell: bash
        run: |
          set -euo pipefail

          cat > "$ANDROID_PROJECT_DIR/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

      - name: Build signed Release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT_DIR"

          gradle clean assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Locate Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$ANDROID_PROJECT_DIR/app/build/outputs/apk/release" \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          if [ -z "${APK:-}" ]; then
            echo "ERROR: Release APK not created"
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo "APK created:"
          echo "$APK"

      - name: Verify APK signature package and version
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS_VERSION="$(
            ls "$ANDROID_HOME/build-tools" \
            | sort -V \
            | tail -n 1
          )"

          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK_PATH" \
            | tee /tmp/psyktikos-certificate.txt

          "$AAPT" dump badging \
            "$APK_PATH" \
            | tee /tmp/psyktikos-badging.txt

          grep -q \
            "package: name='com.psyktikos.app'" \
            /tmp/psyktikos-badging.txt

          grep -q \
            "versionCode='$PSYKTIKOS_VERSION_CODE'" \
            /tmp/psyktikos-badging.txt

          echo "========================================"
          echo "PSYKTIKOS UPDATE VERIFIED"
          echo "Package: com.psyktikos.app"
          echo "VersionCode: $PSYKTIKOS_VERSION_CODE"
          echo "VersionName: $PSYKTIKOS_VERSION_NAME"
          echo "Signing alias: psyktikos"
          echo "========================================"

      - name: Prepare final APK
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/apk-output"
          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK_PATH" \
            "$GITHUB_WORKSPACE/apk-output/Psyktikos.apk"

      - name: Upload Psyktikos Update APK
        uses: actions/upload-artifact@v4
        with:
          name: Psyktikos-UPDATE-APK
          path: apk-output/Psyktikos.apk
          if-no-files-found: error
          retention-days: 30
