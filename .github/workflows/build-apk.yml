name: Build Psyktikos APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build signed Psyktikos APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android project
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          PROJECT="$ROOT/.android-build"

          echo "========================================"
          echo "PREPARING PSYKTIKOS ANDROID PROJECT"
          echo "========================================"

          rm -rf "$PROJECT"

          mkdir -p \
            "$PROJECT/app/src/main/java/com/psyktikos/app" \
            "$PROJECT/app/src/main/res/values" \
            "$PROJECT/keystore"

          cat > "$PROJECT/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Psyktikos"
          include(":app")
          EOF

          cat > "$PROJECT/build.gradle" <<'EOF'
          plugins {
              id "com.android.application" version "8.7.3" apply false
              id "org.jetbrains.kotlin.android" version "2.0.21" apply false
          }
          EOF

          cat > "$PROJECT/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.${GITHUB_RUN_NUMBER}"

          cat > "$PROJECT/app/build.gradle" <<EOF
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.psyktikos.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.psyktikos.app'
                  minSdk 24
                  targetSdk 35

                  versionCode ${VERSION_CODE}
                  versionName '${VERSION_NAME}'
              }

              signingConfigs {
                  release {
                      storeFile file("../keystore/psyktikos-release.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias "psyktikos"
                      keyPassword System.getenv("KEYSTORE_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          echo "Checking source files..."

          test -f "$ROOT/MainActivity.kt"
          test -f "$ROOT/AndroidManifest.xml"
          test -f "$ROOT/strings.xml"
          test -f "$ROOT/themes.xml"

          cp "$ROOT/MainActivity.kt" \
             "$PROJECT/app/src/main/java/com/psyktikos/app/MainActivity.kt"

          cp "$ROOT/AndroidManifest.xml" \
             "$PROJECT/app/src/main/AndroidManifest.xml"

          cp "$ROOT/strings.xml" \
             "$PROJECT/app/src/main/res/values/strings.xml"

          cp "$ROOT/themes.xml" \
             "$PROJECT/app/src/main/res/values/themes.xml"

          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: GitHub Secret KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ ! -f "$ROOT/KEYSTORE_BASE64-1.txt" ]; then
            echo "ERROR: KEYSTORE_BASE64-1.txt is missing."
            exit 1
          fi

          echo "Restoring permanent Psyktikos release keystore..."

          base64 -d "$ROOT/KEYSTORE_BASE64-1.txt" \
            > "$PROJECT/keystore/psyktikos-release.jks"

          chmod 600 "$PROJECT/keystore/psyktikos-release.jks"

          echo "Verifying permanent signing key..."

          keytool \
            -list \
            -v \
            -keystore "$PROJECT/keystore/psyktikos-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias psyktikos \
            > /tmp/psyktikos-keystore-info.txt

          grep -q "Alias name: psyktikos" /tmp/psyktikos-keystore-info.txt

          echo "ANDROID_PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "PSYKTIKOS_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "PSYKTIKOS_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          echo "========================================"
          echo "PROJECT READY"
          echo "Package: com.psyktikos.app"
          echo "VersionCode: $VERSION_CODE"
          echo "VersionName: $VERSION_NAME"
          echo "Signing alias: psyktikos"
          echo "========================================"

      - name: Build signed Release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT_DIR"

          echo "Building RELEASE APK..."

          gradle clean assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$ANDROID_PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: app-release.apk was not created."
            exit 1
          fi

          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt"

          if [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            exit 1
          fi

          if [ ! -x "$AAPT" ]; then
            echo "ERROR: aapt was not found."
            exit 1
          fi

          echo "Verifying APK signature..."

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK" | tee /tmp/apk-certificates.txt

          echo "Verifying package and version..."

          "$AAPT" dump badging "$APK" \
            | tee /tmp/apk-badging.txt

          grep -q "package: name='com.psyktikos.app'" /tmp/apk-badging.txt
          grep -q "versionCode='$PSYKTIKOS_VERSION_CODE'" /tmp/apk-badging.txt

          echo "========================================"
          echo "SIGNED RELEASE APK VERIFIED"
          echo "Package: com.psyktikos.app"
          echo "VersionCode: $PSYKTIKOS_VERSION_CODE"
          echo "VersionName: $PSYKTIKOS_VERSION_NAME"
          echo "========================================"

      - name: Prepare final APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$ANDROID_PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          rm -rf "$GITHUB_WORKSPACE/apk-output"
          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK" \
             "$GITHUB_WORKSPACE/apk-output/Psyktikos.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Psyktikos-UPDATE-APK
          path: apk-output/Psyktikos.apk
          if-no-files-found: error
          retention-days: 30
