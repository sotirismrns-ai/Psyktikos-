name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7'

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          PROJECT_DIR=""

          echo "Checking repository root..."

          if {
            [ -f "$ROOT/settings.gradle" ] ||
            [ -f "$ROOT/settings.gradle.kts" ]
          } && [ -d "$ROOT/app" ] && {
            [ -f "$ROOT/app/build.gradle" ] ||
            [ -f "$ROOT/app/build.gradle.kts" ]
          }; then
            PROJECT_DIR="$ROOT"
          fi

          if [ -n "$PROJECT_DIR" ]; then
            echo "Android project found at repository root:"
            echo "$PROJECT_DIR"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "No Android project at repository root."
            echo "Searching ZIP files..."

            SOURCE_DIR="$ROOT/.android-source"
            rm -rf "$SOURCE_DIR"
            mkdir -p "$SOURCE_DIR"

            ZIP_FOUND="false"

            while IFS= read -r ZIP_FILE; do
              [ -n "$ZIP_FILE" ] || continue

              ZIP_FOUND="true"

              echo
              echo "Checking ZIP:"
              echo "$ZIP_FILE"

              ZIP_NAME="$(basename "$ZIP_FILE" .zip)"
              EXTRACT_DIR="$SOURCE_DIR/$ZIP_NAME"

              rm -rf "$EXTRACT_DIR"
              mkdir -p "$EXTRACT_DIR"

              if ! unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"; then
                echo "WARNING: Could not extract $ZIP_FILE. Skipping."
                rm -rf "$EXTRACT_DIR"
                continue
              fi

              while IFS= read -r SETTINGS_FILE; do
                CANDIDATE_DIR="$(dirname "$SETTINGS_FILE")"

                if [ -d "$CANDIDATE_DIR/app" ] && {
                  [ -f "$CANDIDATE_DIR/app/build.gradle" ] ||
                  [ -f "$CANDIDATE_DIR/app/build.gradle.kts" ]
                }; then
                  PROJECT_DIR="$CANDIDATE_DIR"
                  break 2
                fi
              done < <(
                find "$EXTRACT_DIR" \
                  -type f \
                  \( \
                    -name "settings.gradle" \
                    -o \
                    -name "settings.gradle.kts" \
                  \) \
                  -print
              )

            done < <(
              find "$ROOT" \
                -maxdepth 2 \
                -type f \
                -iname "*.zip" \
                ! -path "$ROOT/.android-source/*" \
                -print
            )

            if [ -z "$PROJECT_DIR" ]; then
              echo
              echo "ERROR: No valid Android project was found."
              echo
              echo "Required structure:"
              echo "  settings.gradle OR settings.gradle.kts"
              echo "  app/"
              echo "  app/build.gradle OR app/build.gradle.kts"
              echo
              echo "Repository contents:"
              find "$ROOT" -maxdepth 4 -print | sort
              exit 1
            fi

            echo
            echo "Android project extracted from ZIP:"
            echo "$PROJECT_DIR"
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app directory is missing."
            echo "PROJECT_DIR=$PROJECT_DIR"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] &&
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle(.kts) is missing."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] &&
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle(.kts) is missing."
            exit 1
          fi

          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo
          echo "======================================"
          echo "ANDROID PROJECT"
          echo "======================================"
          echo "$PROJECT_DIR"
          echo "======================================"

      - name: Enable AndroidX
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT_DIR"

          touch gradle.properties

          if grep -q '^android\.useAndroidX=' gradle.properties; then
            sed -i 's/^android\.useAndroidX=.*/android.useAndroidX=true/' gradle.properties
          else
            printf '\nandroid.useAndroidX=true\n' >> gradle.properties
          fi

          if grep -q '^android\.enableJetifier=' gradle.properties; then
            sed -i 's/^android\.enableJetifier=.*/android.enableJetifier=true/' gradle.properties
          else
            printf 'android.enableJetifier=true\n' >> gradle.properties
          fi

          echo "AndroidX configuration:"
          grep -E '^android\.(useAndroidX|enableJetifier)=' gradle.properties

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT_DIR"

          echo "Building Android application..."

          if [ -f "./gradlew" ]; then
            echo "Using Gradle wrapper."
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --no-daemon
          else
            echo "Gradle wrapper not found."
            echo "Using installed Gradle 9.7."
            gradle clean assembleDebug --no-daemon
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_ROOT="$ANDROID_PROJECT_DIR/app/build/outputs/apk"

          echo "Searching for generated APK..."

          if [ ! -d "$APK_ROOT" ]; then
            echo "ERROR: APK output directory does not exist:"
            echo "$APK_ROOT"
            exit 1
          fi

          APK_FILES="$(find "$APK_ROOT" -type f -name "*.apk" -print)"

          if [ -z "$APK_FILES" ]; then
            echo "ERROR: Build completed but no APK was produced."
            echo
            echo "Available outputs:"
            find "$ANDROID_PROJECT_DIR/app/build/outputs" \
              -type f \
              -print \
              2>/dev/null || true
            exit 1
          fi

          echo
          echo "======================================"
          echo "APK CREATED SUCCESSFULLY"
          echo "======================================"
          echo "$APK_FILES"
          echo "======================================"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Psyktikos-v1.1-APK
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
