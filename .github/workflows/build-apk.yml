name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Psyktikos v1.0 FINAL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Repository root ==="
          pwd
          find . -maxdepth 2 -type f | sort

          ZIP_FILE="Psyktikos_v1_0_FINAL_project.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found."
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted

          echo "=== Extracting $ZIP_FILE ==="
          unzip -q "$ZIP_FILE" -d extracted

          echo "=== Extracted files ==="
          find extracted -maxdepth 5 -type f | sort

      - name: Locate Android Gradle project
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Searching extracted project ==="

          PROJECT_DIR=""

          while IFS= read -r settings_file; do
            candidate="$(dirname "$settings_file")"

            if [ -f "$candidate/app/build.gradle" ] || \
               [ -f "$candidate/app/build.gradle.kts" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | sort)

          if [ -z "$PROJECT_DIR" ]; then
            while IFS= read -r build_file; do
              candidate="$(dirname "$build_file")"

              if [ -d "$candidate/app" ]; then
                PROJECT_DIR="$candidate"
                break
              fi
            done < <(find extracted -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) | sort)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project was not found after ZIP extraction."
            echo "=== Extracted repository tree ==="
            find extracted -maxdepth 8 -print | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=== Android project found ==="
          echo "$PROJECT_DIR"

          echo "=== Project files ==="
          find "$PROJECT_DIR" -maxdepth 4 -type f | sort

      - name: Prepare Gradle project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=== Preparing project ==="
          echo "Project directory: $(pwd)"

          touch gradle.properties

          if ! grep -q '^android.useAndroidX=' gradle.properties; then
            echo 'android.useAndroidX=true' >> gradle.properties
          else
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' gradle.properties
          fi

          if ! grep -q '^android.enableJetifier=' gradle.properties; then
            echo 'android.enableJetifier=true' >> gradle.properties
          else
            sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' gradle.properties
          fi

          cat >> gradle.properties <<'EOF'

          # Psyktikos v1.0 FINAL build configuration
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          awk '!seen[$0]++' gradle.properties > gradle.properties.tmp
          mv gradle.properties.tmp gradle.properties

          echo "=== gradle.properties ==="
          cat gradle.properties

          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found. Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.7
          fi

          chmod +x ./gradlew

          echo "=== Gradle wrapper ==="
          ./gradlew --version

      - name: Fix JVM target compatibility
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python3 <<'PY'
          from pathlib import Path
          import re

          # Fix existing Java/Kotlin 1.8 declarations.
          files = [
              Path("build.gradle"),
              Path("build.gradle.kts"),
              Path("app/build.gradle"),
              Path("app/build.gradle.kts"),
          ]

          for path in files:
              if not path.exists():
                  continue

              text = path.read_text()

              text = text.replace(
                  'sourceCompatibility = JavaVersion.VERSION_1_8',
                  'sourceCompatibility = JavaVersion.VERSION_17'
              )

              text = text.replace(
                  'targetCompatibility = JavaVersion.VERSION_1_8',
                  'targetCompatibility = JavaVersion.VERSION_17'
              )

              text = text.replace(
                  'sourceCompatibility = JavaVersion.VERSION_8',
                  'sourceCompatibility = JavaVersion.VERSION_17'
              )

              text = text.replace(
                  'targetCompatibility = JavaVersion.VERSION_8',
                  'targetCompatibility = JavaVersion.VERSION_17'
              )

              text = text.replace(
                  'jvmTarget = "1.8"',
                  'jvmTarget = "17"'
              )

              text = text.replace(
                  "jvmTarget = '1.8'",
                  'jvmTarget = "17"'
              )

              text = text.replace(
                  'jvmTarget = "8"',
                  'jvmTarget = "17"'
              )

              text = text.replace(
                  "jvmTarget = '8'",
                  'jvmTarget = "17"'
              )

              text = text.replace(
                  'JvmTarget.JVM_1_8',
                  'JvmTarget.JVM_17'
              )

              path.write_text(text)

          # ==========================================================
          # ONLY FIX:
          # Force Android Java and Kotlin compilation to JVM 17.
          #
          # IMPORTANT:
          # Do NOT use options.release = 17.
          # Android Gradle Plugin rejects --release for JavaCompile.
          # ==========================================================

          app_gradle = Path("app/build.gradle")

          if app_gradle.exists():
              text = app_gradle.read_text()

              fix = r'''

          // Psyktikos v1.0 FINAL - JVM compatibility fix
          // Java and Kotlin must compile against the same JVM target.

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          '''

              # Remove the previous incorrect fix if it exists.
              text = re.sub(
                  r'\s*// JVM target compatibility fix\s*'
                  r'tasks\.withType\(org\.gradle\.api\.tasks\.compile\.JavaCompile\)\.configureEach\s*\{'
                  r'\s*options\.release\s*=\s*17\s*'
                  r'\}',
                  '',
                  text,
                  flags=re.MULTILINE
              )

              # Remove any standalone options.release = 17 that may remain.
              text = re.sub(
                  r'(?m)^\s*options\.release\s*=\s*17\s*$',
                  '',
                  text
              )

              # Prevent duplicate insertion.
              if "Psyktikos v1.0 FINAL - JVM compatibility fix" not in text:
                  text = text.rstrip() + fix

              app_gradle.write_text(text)

          # Kotlin DSL project, if the app uses build.gradle.kts.
          app_gradle_kts = Path("app/build.gradle.kts")

          if app_gradle_kts.exists():
              text = app_gradle_kts.read_text()

              # Remove the incorrect Java release setting.
              text = re.sub(
                  r'(?m)^\s*options\.release\.set\(17\)\s*$',
                  '',
                  text
              )

              text = re.sub(
                  r'(?m)^\s*options\.release\s*=\s*17\s*$',
                  '',
                  text
              )

              fix_kts = r'''

          // Psyktikos v1.0 FINAL - JVM compatibility fix
          // Java and Kotlin must compile against the same JVM target.

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          '''

              if "Psyktikos v1.0 FINAL - JVM compatibility fix" not in text:
                  text = text.rstrip() + fix_kts

              app_gradle_kts.write_text(text)

          PY

          echo "=== Build configuration ==="
          sed -n '1,300p' app/build.gradle 2>/dev/null || true
          sed -n '1,300p' app/build.gradle.kts 2>/dev/null || true

      - name: Verify Android Gradle project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=== FINAL PROJECT CHECK ==="
          echo "Directory: $(pwd)"

          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f gradlew

          echo "settings.gradle: OK"
          echo "app/build.gradle: OK"
          echo "gradlew: OK"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=== Building Psyktikos v1.0 FINAL ==="

          ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail

          echo "=== APK files ==="

          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not produced."
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Psyktikos-v1.0-FINAL-APK
          path: ${{ env.APK }}
          if-no-files-found: error
