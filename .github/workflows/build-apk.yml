name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Android project
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          PROJECT="$ROOT/.android-build"

          echo "Preparing Psyktikos Android project..."

          rm -rf "$PROJECT"

          mkdir -p \
            "$PROJECT/app/src/main/java/com/psyktikos/app" \
            "$PROJECT/app/src/main/res/values" \
            "$PROJECT/keystore"

          cat > "$PROJECT/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Psyktikos"
          include(":app")
          EOF

          cat > "$PROJECT/build.gradle" <<'EOF'
          plugins {
              id "com.android.application" version "8.7.3" apply false
              id "org.jetbrains.kotlin.android" version "2.0.21" apply false
          }
          EOF

          cat > "$PROJECT/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > "$PROJECT/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.psyktikos.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.psyktikos.app'
                  minSdk 24
                  targetSdk 35

                  // Previous installed version was 10.
                  // This must be higher for Android to accept the APK as an update.
                  versionCode 11
                  versionName '1.1'
              }

              signingConfigs {
                  release {
                      storeFile file("../keystore/psyktikos-release.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias "psyktikos"
                      keyPassword System.getenv("KEYSTORE_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }

                  debug {
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          # Copy the existing application files exactly as they are.
          cp "$ROOT/MainActivity.kt" \
             "$PROJECT/app/src/main/java/com/psyktikos/app/MainActivity.kt"

          cp "$ROOT/AndroidManifest.xml" \
             "$PROJECT/app/src/main/AndroidManifest.xml"

          cp "$ROOT/strings.xml" \
             "$PROJECT/app/src/main/res/values/strings.xml"

          cp "$ROOT/themes.xml" \
             "$PROJECT/app/src/main/res/values/themes.xml"

          # Verify required source files.
          test -f "$PROJECT/settings.gradle"
          test -f "$PROJECT/build.gradle"
          test -f "$PROJECT/gradle.properties"
          test -f "$PROJECT/app/build.gradle"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT/app/src/main/java/com/psyktikos/app/MainActivity.kt"
          test -f "$PROJECT/app/src/main/res/values/strings.xml"
          test -f "$PROJECT/app/src/main/res/values/themes.xml"

          # Verify signing password exists.
          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: GitHub Secret KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          # Restore the EXISTING Psyktikos release keystore.
          if [ ! -f "$ROOT/KEYSTORE_BASE64-1.txt" ]; then
            echo "ERROR: KEYSTORE_BASE64-1.txt was not found."
            exit 1
          fi

          base64 -d "$ROOT/KEYSTORE_BASE64-1.txt" \
            > "$PROJECT/keystore/psyktikos-release.jks"

          chmod 600 "$PROJECT/keystore/psyktikos-release.jks"

          # Verify that the keystore can actually be opened
          # with the same password and contains the expected alias.
          keytool \
            -list \
            -keystore "$PROJECT/keystore/psyktikos-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias psyktikos \
            > /tmp/psyktikos-keystore-check.txt

          echo "Existing Psyktikos signing key verified successfully."

          echo "ANDROID_PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

          echo "========================================"
          echo "ANDROID PROJECT READY"
          echo "========================================"

      - name: Build signed Release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT_DIR"

          echo "Building signed Psyktikos release..."

          gradle clean assembleRelease --no-daemon

      - name: Verify signed APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          APK="$ANDROID_PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          KEYSTORE="$ANDROID_PROJECT_DIR/keystore/psyktikos-release.jks"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not produced."
            find "$ANDROID_PROJECT_DIR/app/build/outputs" \
              -type f \
              -print || true
            exit 1
          fi

          echo "Checking APK signature..."

          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" \
            -type f \
            -name apksigner \
            | sort -V \
            | tail -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

          echo "Checking APK package/version..."

          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/aapt" \
            dump badging "$APK" \
            | grep -E "package: name='com.psyktikos.app' versionCode='11' versionName='1.1'"

          echo "Checking signing certificate..."

          keytool \
            -list \
            -v \
            -keystore "$KEYSTORE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias psyktikos \
            > /tmp/keystore-cert.txt

          "$APKSIGNER" verify --print-certs "$APK" \
            | tee /tmp/apk-certs.txt

          echo "========================================"
          echo "SIGNED RELEASE APK VERIFIED"
          echo "Package: com.psyktikos.app"
          echo "Version code: 11"
          echo "Version name: 1.1"
          echo "Alias: psyktikos"
          echo "========================================"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Psyktikos-v1.1-UPDATE-APK
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
