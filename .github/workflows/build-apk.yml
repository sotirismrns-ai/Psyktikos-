name: Build APK - Psyktikos v1.0 FINAL - Βλαβολόγιο

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Psyktikos v1.0 FINAL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Psyktikos project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Psyktikos_v1_0_BLABOLOGIO_CODE.zip"

          echo "=== Repository root ==="
          pwd

          echo "=== Repository files ==="
          find . -maxdepth 2 -type f | sort

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found."
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "=== Extracted files ==="
          find extracted -maxdepth 5 -type f | sort

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          while IFS= read -r settings_file; do
            candidate="$(dirname "$settings_file")"

            if [ -f "$candidate/app/build.gradle" ] || \
               [ -f "$candidate/app/build.gradle.kts" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(
            find extracted -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              | sort
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project was not found."

            echo "=== Gradle files found ==="
            find extracted -type f \
              \( -name "build.gradle" \
                 -o -name "build.gradle.kts" \
                 -o -name "settings.gradle" \
                 -o -name "settings.gradle.kts" \) \
              | sort

            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=== Android project ==="
          echo "$PROJECT_DIR"

      - name: Locate MainActivity.kt
        shell: bash
        run: |
          set -euo pipefail

          MAIN_ACTIVITY="$(
            find "$PROJECT_DIR" \
              -type f \
              -name "MainActivity.kt" \
              | head -n 1
          )"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.kt was not found."
            exit 1
          fi

          echo "MAIN_ACTIVITY=$MAIN_ACTIVITY" >> "$GITHUB_ENV"

          echo "=== MainActivity.kt ==="
          echo "$MAIN_ACTIVITY"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=== Building project ==="
          pwd

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Find generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="$(
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "=== APK generated successfully ==="
          echo "$APK_FILE"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/apk-output/Psyktikos-v1.0-BLABOLOGIO.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Psyktikos-v1.0-BLABOLOGIO
          path: apk-output/Psyktikos-v1.0-BLABOLOGIO.apk
          if-no-files-found: error
