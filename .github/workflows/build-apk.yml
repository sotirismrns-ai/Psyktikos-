name: build-apk

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Psyktikos v1.0 FINAL APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: ''

      - name: Find and extract Psyktikos project
        shell: bash
        run: |
          set -e

          echo "=== Repository contents ==="
          find . -maxdepth 3 -type f -print | sort

          ZIP_FILE="$(find . -maxdepth 2 -type f -name 'Psyktikos_v1_0_FINAL_project.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Psyktikos_v1_0_FINAL_project.zip was not found."
            exit 1
          fi

          echo "=== ZIP found ==="
          echo "$ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "=== Extracted contents ==="
          find extracted -maxdepth 5 -type f -print | sort

      - name: Locate Android Gradle project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r SETTINGS_FILE; do
            CANDIDATE="$(dirname "$SETTINGS_FILE")"

            if [ -f "$CANDIDATE/app/build.gradle" ] || \
               [ -f "$CANDIDATE/app/build.gradle.kts" ]; then
              PROJECT_DIR="$CANDIDATE"
              break
            fi
          done < <(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project was not found."
            echo "=== Possible Gradle files ==="
            find extracted -type f \
              \( -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "gradlew" \) \
              -print | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=== Project directory ==="
          echo "$PROJECT_DIR"

          echo "=== Project files ==="
          find "$PROJECT_DIR" -maxdepth 4 -type f -print | sort

      - name: Configure JVM 17
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          cat >> app/build.gradle <<'EOF'

          // CI FIX: Java/Kotlin JVM target compatibility
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          echo "=== Final app/build.gradle JVM configuration ==="
          tail -n 35 app/build.gradle

      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -e

          if ! command -v gradle >/dev/null 2>&1; then
            wget -q \
              https://services.gradle.org/distributions/gradle-8.7-bin.zip \
              -O /tmp/gradle-8.7-bin.zip

            rm -rf "$HOME/gradle-8.7"

            unzip -q \
              /tmp/gradle-8.7-bin.zip \
              -d "$HOME"

            echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"
          fi

          gradle --version

      - name: Build Psyktikos v1.0 FINAL
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== Building Psyktikos v1.0 FINAL ==="

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            find "$PROJECT_DIR/app/build/outputs" -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/Psyktikos_v1_0_FINAL.apk"

          ls -lh "$GITHUB_WORKSPACE/Psyktikos_v1_0_FINAL.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Psyktikos_v1_0_FINAL
          path: Psyktikos_v1_0_FINAL.apk
          if-no-files-found: error
