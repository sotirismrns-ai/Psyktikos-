name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    name: Build Psyktikos v1.0 FINAL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Gradle project
        shell: bash
        run: |
          set -e

          echo "=== Searching for Gradle project ==="

          if [ -f "./gradlew" ]; then
            PROJECT_DIR="."
          elif [ -f "./extracted/Psyktikos_v1_0/gradlew" ]; then
            PROJECT_DIR="./extracted/Psyktikos_v1_0"
          else
            PROJECT_DIR=$(find . -type f -name gradlew -print -quit | xargs -r dirname)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: gradlew was not found."
              exit 1
            fi
          fi

          PROJECT_DIR=$(cd "$PROJECT_DIR" && pwd)

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=== Project directory ==="
          echo "$PROJECT_DIR"

          echo "=== Project files ==="
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort

      - name: Make Gradle executable
        shell: bash
        run: |
          set -e
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build Psyktikos v1.0 FINAL
        shell: bash
        run: |
          set -e

          echo "=== Building Psyktikos v1.0 FINAL ==="

          cd "$PROJECT_DIR"

          ./gradlew clean assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Locate APK
        shell: bash
        run: |
          set -e

          echo "=== APK files ==="

          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Psyktikos-v1.0-FINAL-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
