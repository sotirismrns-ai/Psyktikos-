name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    name: Build Psyktikos v1.0 FINAL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository
        run: |
          set -e
          echo "=== Repository ==="
          pwd
          find . -maxdepth 4 -type f | sort

      - name: Find Android project
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r file; do
            DIR="$(dirname "$file")"

            if [ -f "$DIR/settings.gradle" ] || [ -f "$DIR/settings.gradle.kts" ]; then
              if [ -f "$DIR/app/build.gradle" ] || [ -f "$DIR/app/build.gradle.kts" ]; then
                PROJECT_DIR="$DIR"
                break
              fi
            fi
          done < <(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \))

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project was not found."
            exit 1
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=== Android project found ==="
          echo "$PROJECT_DIR"

          echo "=== Project files ==="
          find "$PROJECT_DIR" -maxdepth 4 -type f | sort

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-35" \
                     "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Configure JVM targets
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("app/build.gradle"),
              Path("app/build.gradle.kts")
          ]

          for path in files:
              if not path.exists():
                  continue

              text = path.read_text()

              if path.name == "build.gradle":
                  if "compileOptions" not in text:
                      text += '''

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          '''

                  if "kotlinOptions" not in text:
                      text += '''

          android {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          '''

              path.write_text(text)
              print(f"Updated JVM configuration: {path}")
              break
          PY

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "=== Building Psyktikos v1.0 FINAL ==="

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --no-daemon
          else
            echo "Gradle wrapper not found."
            echo "Using installed Gradle 8.7."
            gradle clean assembleDebug --no-daemon
          fi

      - name: Locate APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "=== APK files ==="
          find . -type f -name "*.apk" -print

          APK="$(find . -type f -name "*-debug.apk" | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Rename APK
        run: |
          set -e

          mkdir -p release

          cp "$PROJECT_DIR/$APK" \
             "release/Psyktikos_v1_0_FINAL.apk"

          echo "=== Final APK ==="
          ls -lh release/Psyktikos_v1_0_FINAL.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Psyktikos_v1_0_FINAL
          path: release/Psyktikos_v1_0_FINAL.apk
          if-no-files-found: error
