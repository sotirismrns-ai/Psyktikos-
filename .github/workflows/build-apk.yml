name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          # First try the repository itself.
          if [ -f "$GITHUB_WORKSPACE/settings.gradle" ] &&
             [ -d "$GITHUB_WORKSPACE/app" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          fi

          # If the project is stored inside the committed ZIP,
          # extract it and locate the real Android project.
          if [ -z "$PROJECT_DIR" ]; then
            ZIP_FILE="$GITHUB_WORKSPACE/Psyktikos_v1_0_FINAL_2changes.zip"

            if [ ! -f "$ZIP_FILE" ]; then
              echo "ERROR: Project ZIP not found:"
              echo "$ZIP_FILE"
              exit 1
            fi

            rm -rf "$GITHUB_WORKSPACE/.android-source"
            mkdir -p "$GITHUB_WORKSPACE/.android-source"

            unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/.android-source"

            while IFS= read -r settings_file; do
              candidate_dir="$(dirname "$settings_file")"

              if [ -d "$candidate_dir/app" ]; then
                PROJECT_DIR="$candidate_dir"
                break
              fi
            done < <(
              find "$GITHUB_WORKSPACE/.android-source" \
                -type f \
                -name "settings.gradle" \
                -o -name "settings.gradle.kts"
            )
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not locate a valid Android project."
            echo "A directory containing both settings.gradle and app/ is required."
            echo
            echo "Repository contents:"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type d | sort
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: Located project does not contain app/."
            echo "PROJECT_DIR=$PROJECT_DIR"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] &&
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: Located project does not contain settings.gradle or settings.gradle.kts."
            exit 1
          fi

          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found:"
          echo "$PROJECT_DIR"

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug
          elif [ -f "./gradlew.bat" ]; then
            echo "ERROR: gradlew.bat found but Linux gradlew is missing."
            exit 1
          else
            echo "Gradle wrapper not found. Using installed Gradle."
            gradle clean assembleDebug
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$ANDROID_PROJECT_DIR/app/build/outputs/apk/debug"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: APK output directory does not exist:"
            echo "$APK_DIR"
            exit 1
          fi

          APK_COUNT="$(find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" | wc -l)"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: Build completed but no APK was produced."
            find "$ANDROID_PROJECT_DIR/app/build/outputs" -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK successfully created:"
          find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Psyktikos-v1.0-debug
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
