name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare project
        shell: bash
        run: |
          set -e

          echo "=== Repository contents ==="
          find . -maxdepth 3 -type f | sort

          rm -rf extracted
          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP project not found."
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extracted

          echo "=== Extracted contents ==="
          find extracted -maxdepth 5 -type f | sort

          PROJECT_DIR=$(find extracted \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts was not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configure Gradle properties
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          EOF

          echo "=== gradle.properties ==="
          cat gradle.properties

      - name: Force Java and Kotlin JVM target 17
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== Configuring JVM 17 ==="

          cat >> build.gradle <<'EOF'

          // ============================================================
          // FORCE JVM 17 FOR ALL JAVA AND KOTLIN COMPILE TASKS
          // ============================================================

          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                  compilerOptions {
                      jvmTarget.set(
                          org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                      )
                  }
              }
          }
          EOF

          echo "=== Root build.gradle after JVM configuration ==="
          tail -n 60 build.gradle

          if [ -f "app/build.gradle" ]; then
              echo "=== app/build.gradle BEFORE patch ==="
              cat app/build.gradle

              cat >> app/build.gradle <<'EOF'

          // ============================================================
          // ANDROID APP JVM CONFIGURATION
          // ============================================================

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(JavaCompile).configureEach {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              compilerOptions {
                  jvmTarget.set(
                      org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                  )
              }
          }
          EOF

              echo "=== app/build.gradle AFTER patch ==="
              tail -n 80 app/build.gradle
          fi

          if [ -f "app/build.gradle.kts" ]; then
              echo "=== app/build.gradle.kts detected ==="
              cat app/build.gradle.kts

              cat >> app/build.gradle.kts <<'EOF'

          // ============================================================
          // ANDROID APP JVM CONFIGURATION
          // ============================================================

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          tasks.withType<JavaCompile>().configureEach {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              compilerOptions {
                  jvmTarget.set(
                      org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                  )
              }
          }
          EOF

              echo "=== app/build.gradle.kts AFTER patch ==="
              tail -n 80 app/build.gradle.kts
          fi

      - name: Check Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== Java ==="
          java -version

          echo "=== Gradle ==="
          gradle --version

      - name: Verify JVM targets
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== JVM TARGET VERIFICATION ==="

          grep -RIn \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            -E \
            "VERSION_1_8|jvmTarget.*1\.8|jvmTarget.*8|VERSION_17|JVM_17|jvmTarget.*17" \
            . || true

          echo "=== Gradle tasks ==="
          gradle tasks --no-daemon

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== Building APK ==="

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Locate APK
        shell: bash
        run: |
          set -e

          echo "=== Searching for APK ==="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "Found APK:"
          echo "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Psyktikos_v1_0_DEBUG_APK
          path: ${{ env.APK }}
          if-no-files-found: error
