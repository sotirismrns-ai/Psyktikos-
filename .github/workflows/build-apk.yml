name: Build APK - Psyktikos v1.0 FINAL

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Psyktikos v1.0 FINAL
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Psyktikos project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Psyktikos_v1_0_BLABOLOGIO_CODE.zip"

          echo "=== Repository root ==="
          pwd

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found."
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "=== Extracted files ==="
          find extracted -maxdepth 5 -type f | sort

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          while IFS= read -r settings_file; do
            candidate="$(dirname "$settings_file")"

            if [ -f "$candidate/app/build.gradle" ] || \
               [ -f "$candidate/app/build.gradle.kts" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(
            find extracted -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              | sort
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project was not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=== Android project ==="
          echo "$PROJECT_DIR"

      - name: Enable AndroidX
        shell: bash
        run: |
          set -euo pipefail

          FILE="$PROJECT_DIR/gradle.properties"

          if [ -f "$FILE" ]; then

            if grep -q '^android.useAndroidX=' "$FILE"; then
              sed -i \
                's/^android.useAndroidX=.*/android.useAndroidX=true/' \
                "$FILE"
            else
              printf '\nandroid.useAndroidX=true\n' >> "$FILE"
            fi

          else
            printf 'android.useAndroidX=true\n' > "$FILE"
          fi

          echo "=== gradle.properties ==="
          cat "$FILE"

      - name: Fix Java/Kotlin JVM compatibility
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="$PROJECT_DIR/app/build.gradle"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          python3 - "$APP_GRADLE" <<'PY'
          from pathlib import Path
          import sys
          import re

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          # -------------------------------------------------
          # Java 17
          # -------------------------------------------------

          compile_options = """compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
          }"""

          if re.search(r'\bcompileOptions\s*\{', text):
              text = re.sub(
                  r'\bcompileOptions\s*\{.*?\}',
                  compile_options,
                  text,
                  count=1,
                  flags=re.DOTALL
              )
          else:
              android_match = re.search(r'\bandroid\s*\{', text)

              if not android_match:
                  raise SystemExit(
                      "ERROR: android { } block was not found."
                  )

              insertion = (
                  "\n\n    "
                  + compile_options.replace("\n", "\n    ")
                  + "\n"
              )

              text = (
                  text[:android_match.end()]
                  + insertion
                  + text[android_match.end():]
              )

          # -------------------------------------------------
          # Kotlin 17
          # -------------------------------------------------

          kotlin_block = """kotlinOptions {
              jvmTarget = '17'
          }"""

          if re.search(r'\bkotlinOptions\s*\{', text):
              text = re.sub(
                  r'\bkotlinOptions\s*\{.*?\}',
                  kotlin_block,
                  text,
                  count=1,
                  flags=re.DOTALL
              )
          else:
              text += """

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          """

          path.write_text(text, encoding="utf-8")

          PY

          echo "=== Java/Kotlin configuration ==="
          grep -n -A6 -B2 "compileOptions" "$APP_GRADLE" || true
          grep -n -A6 -B2 "kotlinOptions" "$APP_GRADLE" || true

      - name: Set unique versionCode for Android update
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="$PROJECT_DIR/app/build.gradle"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          python3 - "$APP_GRADLE" "$GITHUB_RUN_NUMBER" <<'PY'
          from pathlib import Path
          import sys
          import re

          path = Path(sys.argv[1])
          run_number = int(sys.argv[2])

          text = path.read_text(encoding="utf-8")

          # Every GitHub Actions run gets a unique, increasing
          # Android versionCode.
          new_code = 1000 + run_number

          match = re.search(
              r'(\bversionCode\s+)(\d+)',
              text
          )

          if not match:
              raise SystemExit(
                  "ERROR: versionCode was not found in app/build.gradle."
              )

          old_code = int(match.group(2))

          text = (
              text[:match.start(2)]
              + str(new_code)
              + text[match.end(2):]
          )

          path.write_text(text, encoding="utf-8")

          print(f"versionCode changed: {old_code} -> {new_code}")
          print(f"GITHUB_RUN_NUMBER: {run_number}")
          PY

          echo "=== Final Android versionCode ==="
          grep -n "versionCode" "$APP_GRADLE"

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=== Building APK ==="
          pwd

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --stacktrace
          else
            gradle clean assembleDebug --stacktrace
          fi

      - name: Find generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="$(
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "=== APK generated ==="
          echo "$APK_FILE"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/apk-output/Psyktikos-v1.0-BLABOLOGIO.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Psyktikos-v1.0-BLABOLOGIO
          path: apk-output/Psyktikos-v1.0-BLABOLOGIO.apk
          if-no-files-found: error
