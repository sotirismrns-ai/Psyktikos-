      - name: Fix JVM target compatibility
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python3 <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("build.gradle"),
              Path("build.gradle.kts"),
              Path("app/build.gradle"),
              Path("app/build.gradle.kts"),
          ]

          for path in files:
              if not path.exists():
                  continue

              text = path.read_text()

              text = re.sub(
                  r'(?m)^\s*sourceCompatibility\s*=\s*JavaVersion\.VERSION_1_8\s*$',
                  '    sourceCompatibility = JavaVersion.VERSION_17',
                  text
              )

              text = re.sub(
                  r'(?m)^\s*targetCompatibility\s*=\s*JavaVersion\.VERSION_1_8\s*$',
                  '    targetCompatibility = JavaVersion.VERSION_17',
                  text
              )

              text = text.replace(
                  'sourceCompatibility = JavaVersion.VERSION_1_8',
                  'sourceCompatibility = JavaVersion.VERSION_17'
              )

              text = text.replace(
                  'targetCompatibility = JavaVersion.VERSION_1_8',
                  'targetCompatibility = JavaVersion.VERSION_17'
              )

              text = text.replace(
                  'jvmTarget = "1.8"',
                  'jvmTarget = "17"'
              )

              text = text.replace(
                  "jvmTarget = '1.8'",
                  'jvmTarget = "17"'
              )

              text = text.replace(
                  'JvmTarget.JVM_1_8',
                  'JvmTarget.JVM_17'
              )

              path.write_text(text)

          app_gradle = Path("app/build.gradle")

          if app_gradle.exists():
              text = app_gradle.read_text()

              fix = '''

          // JVM target compatibility fix
          tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
              sourceCompatibility = "17"
              targetCompatibility = "17"
          }
          '''

              if "sourceCompatibility = \"17\"" not in text or \
                 "targetCompatibility = \"17\"" not in text:
                  app_gradle.write_text(text.rstrip() + fix)

          PY

          echo "=== Build configuration ==="
          sed -n '1,260p' app/build.gradle 2>/dev/null || true
          sed -n '1,260p' app/build.gradle.kts 2>/dev/null || true
