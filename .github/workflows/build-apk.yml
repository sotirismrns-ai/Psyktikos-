name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          PROJECT="$ROOT/.android-build"

          rm -rf "$PROJECT"

          mkdir -p \
            "$PROJECT/app/src/main/java/com/psyktikos/app" \
            "$PROJECT/app/src/main/res/values"

          # Root project configuration
          cat > "$PROJECT/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'Psyktikos'
          include ':app'
          EOF

          cat > "$PROJECT/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # The repository's existing build.gradle is the Android app module
          # configuration, so place it at the correct Gradle module location.
          cp "$ROOT/build.gradle" \
             "$PROJECT/app/build.gradle"

          # Application source
          cp "$ROOT/MainActivity.kt" \
             "$PROJECT/app/src/main/java/com/psyktikos/app/MainActivity.kt"

          # Manifest
          cp "$ROOT/AndroidManifest.xml" \
             "$PROJECT/app/src/main/AndroidManifest.xml"

          # Resources
          cp "$ROOT/strings.xml" \
             "$PROJECT/app/src/main/res/values/strings.xml"

          cp "$ROOT/themes.xml" \
             "$PROJECT/app/src/main/res/values/themes.xml"

          # Validate everything before Gradle starts.
          test -f "$PROJECT/settings.gradle"
          test -f "$PROJECT/gradle.properties"
          test -f "$PROJECT/app/build.gradle"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT/app/src/main/java/com/psyktikos/app/MainActivity.kt"
          test -f "$PROJECT/app/src/main/res/values/strings.xml"
          test -f "$PROJECT/app/src/main/res/values/themes.xml"

          echo
          echo "========================================"
          echo "ANDROID PROJECT PREPARED"
          echo "========================================"
          find "$PROJECT" -maxdepth 7 -type f -print | sort
          echo "========================================"

          echo "ANDROID_PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Configure Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper found."
            ./gradlew --version
          else
            echo "Gradle wrapper not present."
            echo "Using installed Gradle."
            gradle --version
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --no-daemon
          else
            gradle clean assembleDebug --no-daemon
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$ANDROID_PROJECT_DIR/app/build/outputs/apk"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: APK output directory was not created."
            exit 1
          fi

          APK_COUNT="$(find "$APK_DIR" -type f -name "*.apk" | wc -l)"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: Build completed but no APK was produced."
            find "$ANDROID_PROJECT_DIR/app/build/outputs" \
              -type f \
              -print \
              2>/dev/null || true
            exit 1
          fi

          echo
          echo "========================================"
          echo "APK CREATED SUCCESSFULLY"
          echo "========================================"

          find "$APK_DIR" -type f -name "*.apk" -print

          echo "========================================"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Psyktikos-v1.1-APK
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
