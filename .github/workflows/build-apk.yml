name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          PROJECT="$ROOT/.android-build"

          rm -rf "$PROJECT"

          mkdir -p \
            "$PROJECT/app/src/main/java/com/psyktikos/app" \
            "$PROJECT/app/src/main/res/values"

          cat > "$PROJECT/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Psyktikos"
          include(":app")
          EOF

          cat > "$PROJECT/build.gradle" <<'EOF'
          plugins {
              id "com.android.application" version "8.7.3" apply false
              id "org.jetbrains.kotlin.android" version "2.0.21" apply false
          }
          EOF

          cat > "$PROJECT/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > "$PROJECT/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.psyktikos.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.psyktikos.app'
                  minSdk 24
                  targetSdk 35
                  versionCode 10
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          cp "$ROOT/MainActivity.kt" \
             "$PROJECT/app/src/main/java/com/psyktikos/app/MainActivity.kt"

          cp "$ROOT/AndroidManifest.xml" \
             "$PROJECT/app/src/main/AndroidManifest.xml"

          cp "$ROOT/strings.xml" \
             "$PROJECT/app/src/main/res/values/strings.xml"

          cp "$ROOT/themes.xml" \
             "$PROJECT/app/src/main/res/values/themes.xml"

          test -f "$PROJECT/settings.gradle"
          test -f "$PROJECT/build.gradle"
          test -f "$PROJECT/gradle.properties"
          test -f "$PROJECT/app/build.gradle"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT/app/src/main/java/com/psyktikos/app/MainActivity.kt"
          test -f "$PROJECT/app/src/main/res/values/strings.xml"
          test -f "$PROJECT/app/src/main/res/values/themes.xml"

          echo "ANDROID_PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

          echo "========================================"
          echo "ANDROID PROJECT READY"
          echo "========================================"

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT_DIR"

          echo "Building Psyktikos..."

          gradle clean assembleDebug --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$ANDROID_PROJECT_DIR/app/build/outputs/apk"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: APK output directory does not exist."
            exit 1
          fi

          APK_COUNT=$(find "$APK_DIR" -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was produced."
            find "$ANDROID_PROJECT_DIR/app/build/outputs" \
              -type f \
              -print || true
            exit 1
          fi

          echo "========================================"
          echo "APK CREATED SUCCESSFULLY"
          echo "========================================"

          find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Psyktikos-v1.1-APK
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
