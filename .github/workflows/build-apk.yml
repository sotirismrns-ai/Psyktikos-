name: Build APK - Psyktikos v1.0 FINAL

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Psyktikos v1.0 FINAL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          rm -rf extracted
          mkdir extracted

          unzip -q Psyktikos_v1_0_FINAL_project.zip -d extracted

          echo "=== Project files ==="
          find extracted -maxdepth 5 -type f | sort

      - name: Locate Android project
        run: |
          PROJECT_DIR=$(find extracted -type f -name "settings.gradle" -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle was not found."
            find extracted -maxdepth 8 -type f | sort
            exit 1
          fi

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Building from:"
          pwd

          echo "=== Project ==="
          ls -la

          echo "=== Gradle version ==="
          gradle --version

          echo "=== Building APK ==="
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "=== APK files ==="
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Psyktikos-v1.0-FINAL-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
