name: Build APK - Psyktikos v1.0 FINAL - Βλαβολόγιο

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Psyktikos v1.0 FINAL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Psyktikos project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Psyktikos_v1_0_BLABOLOGIO_CODE.zip"

          echo "=== Repository root ==="
          pwd

          echo "=== Repository files ==="
          find . -maxdepth 2 -type f | sort

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found."
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "=== Extracted project ==="
          find extracted -maxdepth 5 -type f | sort

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          while IFS= read -r settings_file; do
            candidate="$(dirname "$settings_file")"

            if [ -f "$candidate/app/build.gradle" ] || \
               [ -f "$candidate/app/build.gradle.kts" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(
            find extracted -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              | sort
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project was not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=== Android project ==="
          echo "$PROJECT_DIR"

      - name: Enable AndroidX
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_PROPERTIES="$PROJECT_DIR/gradle.properties"

          echo "=== Enabling AndroidX ==="

          if [ -f "$GRADLE_PROPERTIES" ]; then
            if grep -q '^android\.useAndroidX=' "$GRADLE_PROPERTIES"; then
              sed -i \
                's/^android\.useAndroidX=.*/android.useAndroidX=true/' \
                "$GRADLE_PROPERTIES"
            else
              printf '\nandroid.useAndroidX=true\n' >> "$GRADLE_PROPERTIES"
            fi
          else
            printf 'android.useAndroidX=true\n' > "$GRADLE_PROPERTIES"
          fi

          echo "=== gradle.properties ==="
          cat "$GRADLE_PROPERTIES"

      - name: Configure Java and Kotlin JVM target 17
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="$PROJECT_DIR/app/build.gradle"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "ERROR: $APP_GRADLE not found."
            exit 1
          fi

          python3 - "$APP_GRADLE" <<'PY'
          from pathlib import Path
          import sys
          import re

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          # Java 17
          compile_options = """compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
          }"""

          if re.search(r'\bcompileOptions\s*\{', text):
              text = re.sub(
                  r'compileOptions\s*\{.*?\}',
                  compile_options,
                  text,
                  count=1,
                  flags=re.DOTALL
              )
          else:
              match = re.search(r'\bandroid\s*\{', text)

              if not match:
                  raise SystemExit(
                      "ERROR: android { } block was not found."
                  )

              text = (
                  text[:match.end()]
                  + "\n\n    "
                  + compile_options.replace("\n", "\n    ")
                  + "\n"
                  + text[match.end():]
              )

          # Kotlin JVM target 17.
          kotlin_options = """kotlinOptions {
              jvmTarget = '17'
          }"""

          if re.search(r'\bkotlinOptions\s*\{', text):
              text = re.sub(
                  r'kotlinOptions\s*\{.*?\}',
                  kotlin_options,
                  text,
                  count=1,
                  flags=re.DOTALL
              )
          else:
              text += """

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          """

          path.write_text(text, encoding="utf-8")
          PY

          echo "=== JVM configuration ==="
          grep -n -A5 -B2 "compileOptions" "$APP_GRADLE" || true
          grep -n -A5 -B2 "kotlinOptions" "$APP_GRADLE" || true

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=== Building project ==="
          pwd

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Find generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="$(
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "=== APK generated successfully ==="
          echo "$APK_FILE"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/apk-output/Psyktikos-v1.0-BLABOLOGIO.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Psyktikos-v1.0-BLABOLOGIO
          path: apk-output/Psyktikos-v1.0-BLABOLOGIO.apk
          if-no-files-found: error
